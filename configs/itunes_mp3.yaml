# UniverSR-mod: iTunes MP3 restoration finetune at native 44.1 kHz, tuned for RTX 2080 Ti 11 GB / 16 GB RAM.
# Data goes in data/itunes_mp3/{train,val}/{LQ,HQ}. Arm C (aligned channels); set model.aligned_input: false for arm B.
# Arm A (zero-shot) is the baseline pass that train.py runs before step 0.
#
# How this config adapts the model to codec damage (each is a key below, none needs code changes):
#   datas.cutoff_hz 24000        the whole LQ spectrum is valid input, including the isolated spikes above the lowpass
#   model.aligned_input true     the degraded spectrum is shown bin by bin, so damaged bins inside the LQ band can be repaired
#   model.gen_start_bin 80       bins below ~3.7 kHz are copied from the LQ; 0 would regenerate them too
#   transform n_fft/hop/sr       960 / 480 / 44100 with 480 bins: native rate, bin spacing within 2% of the pretrained model
#   transform.alpha 0.2          pretrained value; lowering it (or annealing it) cost quiet-bin level and ViSQOL in testing
#   system.t_skew 1.5            more training on the clean end of the flow, where fine noise-like detail is learned
#   system.val_guidance 1.0      plain conditional prediction; 1.5 (upstream) exaggerated the LQ's influence on level
#   optimizer.lr_mult            3x learning rate on the new aligned channels and the bandwidth embedding

exp:
  dir: ./runs
  name: itunes_mp3

resume: true
seed: 42
# Start weights: set to a Lightning checkpoint from the 48 kHz run (EMA weights are loaded, the optimizer starts fresh),
# e.g. runs/<name>/<timestamp>/checkpoints/step=....ckpt. null = models/pytorch_model.bin. Ignored when resuming this run.
weights_path: null

optimizations:
  tf32: true               # no-op on Turing, kept for parity with Apollo configs
  cudnn_benchmark: true
  triton_cache: true
  ram_limit_fraction: 0.98 # watchdog exits cleanly above this share of system RAM

training:
  max_steps: 500000        # open-ended; Ctrl+C saves, --resume continues
  grad_accum_steps: 1
  grad_clip: 1.0
  precision: auto          # fp16-mixed on Turing, bf16 on Ampere+
  ema_decay: 0.999         # EMA weights are what validation scores and what best_model.pth exports
  # Apollo froze its first 4 of 6 layers. Here the two high-resolution encoder stages are frozen,
  # which also saves grads and optimizer state. init_conv (the new aligned channels) and the
  # bandwidth embedding stay trainable. Set to [] to train everything.
  freeze: []               # nothing frozen; list name prefixes (e.g. "encoders.0.") to freeze
  val_songs: 6
  val_rotate_every: 20000  # steps
  val_check_interval: 200  # optimizer steps
  limit_val_batches: 1.0
  log_every_n_steps: 10
  eval_clips: 24           # clips per model for core/evaluate.py

datas:
  sr: 44100                # native rate of the files; nothing is resampled
  segment_sec: 3           # cached chunk length
  overlap: 0.5
  crop_samples: 30719      # training crop taken from each chunk (64 frames, ~0.70 s)
  batch_size: 6            # ~0.70 s crops; 6 measured ~10 GB reserved on the 2080 Ti, first knob to turn if VRAM is tight
  num_workers: 2
  pin_memory: false
  val_bootstrap_chunks: 15
  align_data: 0            # samples of encoder delay to trim from LQ, or false/0 for none
  cutoff_hz: 24000         # full band: the whole LQ spectrum (incl. the specks above the lowpass) is valid conditioning.
                           # auto | Hz | [min_hz, max_hz] are also accepted; the live `noise` augmentation defeats auto
  cache_peak_dbfs: -1.0
  train_peak_dbfs: [-6.0, -1.0]
  val_peak_dbfs: -3.0
  augmentation:
    live:
      enabled: true
      stereo_alternation: {enabled: true, prob: 1.0}
      mid_side_isolation: {enabled: false, prob_mid: 0.1, prob_side: 0.1}
      gain: {enabled: true, prob: 0.5, db_max: 1.5}
      deep_gain: {enabled: true, prob: 0.03, db_min: -10.0, db_max: -6.0}
      silence_dip:
        enabled: true
        prob: 0.05
        max_hold_sec: 2.0
        short_ramp_ms: 10.0
        short_ramp_max_ms: 50.0
        medium_ramp_ms: 50.0
        medium_ramp_max_ms: 200.0
        long_ramp_ms: 200.0
        long_ramp_max_ms: 1000.0
      polarity: {enabled: false, prob: 0.5}
      pitch_shift: {enabled: false, prob: 0.5, semitones_max: 1.5}
      noise: {enabled: false, prob: 0.5, sigma: 0.002}
      mp3_degradation: {enabled: false, prob: 0.5, kbps_min: 64, kbps_max: 256}
    cached:
      enabled: false
      cached_variants: 1
      stereo_alternation: {enabled: false, fraction: 1.0}
      gain: {enabled: false, fraction: 0.5, db_max: 1.5}
      polarity: {enabled: false, fraction: 0.5}
      pitch_shift: {enabled: false, fraction: 0.5, semitones_max: 1.5}
      noise: {enabled: false, fraction: 0.5, sigma: 0.002}
      mp3_degradation: {enabled: false, fraction: 0.5, kbps_min: 64, kbps_max: 256}

# Pretrained architecture (unchanged) plus the mod settings.
model:
  in_channels: 2
  out_channels: 2
  dims: [96, 192, 384, 768]
  depths: [2, 2, 4, 2]
  drop_path: 0
  time_dim: 256
  cond_dim: 384
  total_freq_bins: 480     # 0 to 22.05 kHz
  feature_enc_layers: 4
  cond_dropout_prob: 0.1
  gen_start_bin: 80        # 80 = pretrained region (step 0 matches the released model); 0 also generates bins 0-79
  aligned_input: true      # arm C: degraded spectrum + mask as zero-initialised extra input channels
  grad_checkpoint: true    # per-block activation checkpointing; set false for speed if VRAM allows
  fast_ops: true           # fused GRN / LayerNorm, same maths and weights; false = original ops
  channels_last: false     # NHWC memory format for the convs; try true after running tests/bench_gpu.py
  fp32_modules: [encoders.3.blocks, midcoder]   # run in fp32: the pretrained net overflows fp16 here (peak ~1e5). [] disables

transform:
  window_fn: hann
  n_fft: 960
  sampling_rate: 44100
  hop_length: 480
  alpha: 0.2               # pretrained value; changing it shifts the decoded level of quiet bins
  beta: 1
  comp_eps: 0.0001

optimizer:
  type: adamw              # adamw | adamw_8bit | gefen | gefen_muon
  lr: 3.0e-5               # was 1e-5 (Apollo lr_g); raised when ViSQOL gains flattened. new-part groups get lr_mult x this
  weight_decay: 0.01
  betas: [0.9, 0.999]
  lr_mult: {"init_conv.": 3.0, "bw_embedder.": 3.0}   # new aligned channels and bandwidth embedding: 3x base = ~1e-4, the rate they first learned fast at (adamw only)

# Apollo used StepLR(2, 0.98); this scheduler steps per optimizer step, so that would collapse the
# learning rate within a few hundred steps. Constant after a short warmup is the closest equivalent.
scheduler:
  type: constant           # constant | cosine | steplr
  warmup_steps: 200

system:
  sigma_min: 1.0e-4
  val_ode_steps: 4
  val_guidance: 1.0
  val_chunk_sec: 4.0       # restore validation clips in 4 s overlapped chunks; a whole 10 s clip needs ~10 GB of VRAM
  mem_log: false           # [mem] lines: torch alloc/reserved/peak, driver VRAM, allocator retries, RSS, at train/val/chunk points
  mem_log_every: 50        # optimizer steps between [mem] lines while training (0 = off)
  val_seed: 1234
  visqol_fraction: 1.0
  keep_lq_below_cutoff: auto   # auto: keep real bins below the cutoff in arm B, regenerate them in arm C
  lsd_cutoff_hz: 16000     # LSD is measured above this frequency (the model cutoff is full band, so it can't define the region)
  t_skew: 1.5              # flow time t = 1-(1-u)^p, u uniform; p > 1 spends more training on the clean end (fine detail), 1 = uniform
  aux_logmag_weight: 0.0   # weight of a log-magnitude loss on the one-step clean estimate; 0 = off. At 0.1 the restored high band came out ~19 dB above HQ in testing
  alpha_start: null          # compression exponent the anneal starts from (the checkpoint's); null = no anneal
  alpha_anneal_steps: 0      # steps to slide from alpha_start to transform.alpha, counted from the step a run starts or resumes at
